
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Motion Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f8fafc;font-family:Arial,sans-serif;padding:24px}
main{max-width:760px;margin:auto}
h1{margin-bottom:8px}
p{color:#b9c4d5;line-height:1.5}
.panel{background:#1c293b;padding:20px;border-radius:16px;margin-top:18px}
label{display:block;margin:16px 0 8px;font-weight:bold}
input,select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #46556b;background:#111c2c;color:white}
button{background:#e63946;border:0;font-weight:bold;cursor:pointer;margin-top:16px}
button:disabled{opacity:.5}
canvas{width:100%;display:block;margin-top:16px;border-radius:12px;background:#080d15}
#status{white-space:pre-wrap}
a{color:#93c5fd}
</style>
</head>
<body>
<main>
<h1>🎬 News Motion Studio</h1>
<p>Tạo video tin tức từ ảnh với hiệu ứng zoom và lia máy tự động.</p>
<div class="panel">
<label for="photo">1. Chọn ảnh</label>
<input id="photo" type="file" accept="image/*">

<label for="ratio">2. Tỷ lệ video</label>
<select id="ratio">
<option value="9:16">Dọc 9:16 — Facebook Reels</option>
<option value="4:5">4:5 — Facebook Feed</option>
<option value="16:9">Ngang 16:9</option>
<option value="1:1">Vuông 1:1</option>
</select>

<label for="duration">3. Thời lượng</label>
<select id="duration">
<option value="5">5 giây</option>
<option value="10" selected>10 giây</option>
<option value="15">15 giây</option>
</select>

<label for="motion">4. Chuyển động</label>
<select id="motion">
<option value="zoom">Zoom vào nhẹ</option>
<option value="out">Zoom ra nhẹ</option>
<option value="pan">Lia máy ngang</option>
</select>

<button id="preview">Xem ảnh</button>
<canvas id="canvas" width="360" height="640"></canvas>
<button id="render">Tạo video MP4/WebM</button>
<p id="status">Chọn ảnh để bắt đầu.</p>
<a id="download" hidden>Tải video về máy</a>
</div>
</main>
<script>
const photo=document.querySelector('#photo');
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d');
const status=document.querySelector('#status');
const download=document.querySelector('#download');
let img=null, raf=0;

photo.onchange=()=>{
  const f=photo.files[0];
  if(!f)return;
  if(img)URL.revokeObjectURL(img.src);
  img=new Image();
  img.onload=()=>{draw(0);status.textContent='Ảnh đã sẵn sàng.'};
  img.src=URL.createObjectURL(f);
};

function setup(){
  const [w,h]=document.querySelector('#ratio').value.split(':').map(Number);
  const width=720;
  canvas.width=width;
  canvas.height=Math.round(width*h/w);
}
function draw(t){
  if(!img)return;
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#080d15';ctx.fillRect(0,0,W,H);
  const cover=Math.max(W/img.width,H/img.height);
  const mode=document.querySelector('#motion').value;
  let z=1,dx=0;
  if(mode==='zoom')z=1+0.12*t;
  if(mode==='out')z=1.12-0.12*t;
  if(mode==='pan')dx=(W-img.width*cover)*0.35*t;
  const dw=img.width*cover*z,dh=img.height*cover*z;
  const x=(W-dw)/2+dx,y=(H-dh)/2;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.drawImage(img,x,y,dw,dh);ctx.restore();
}
document.querySelector('#preview').onclick=()=>{
  if(!img){status.textContent='Vui lòng chọn ảnh trước.';return}
  cancelAnimationFrame(raf);setup();draw(0);
};
document.querySelector('#render').onclick=async()=>{
  if(!img){status.textContent='Vui lòng chọn ảnh trước.';return}
  if(!canvas.captureStream||!window.MediaRecorder){
    status.textContent='Trình duyệt không hỗ trợ quay canvas. Hãy dùng Chrome mới nhất.';
    return;
  }
  const btn=document.querySelector('#render');
  btn.disabled=true;download.hidden=true;
  setup();
  const seconds=Number(document.querySelector('#duration').value);
  const stream=canvas.captureStream(30);
  const mime=['video/mp4;codecs=h264','video/webm;codecs=vp9','video/webm']
    .find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){
    status.textContent='Không tìm thấy định dạng video được hỗ trợ.';
    btn.disabled=false;return;
  }
  const recorder=new MediaRecorder(stream,{mimeType:mime});
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(chunks,{type:mime});
    download.href=URL.createObjectURL(blob);
    download.download='news-motion.'+(mime.includes('mp4')?'mp4':'webm');
    download.textContent='⬇ Tải video '+(mime.includes('mp4')?'MP4':'WebM');
    download.hidden=false;
    status.textContent='Hoàn tất! Video đã được tạo.';
    btn.disabled=false;
  };
  let start=performance.now();
  recorder.start();
  function frame(now){
    const t=Math.min(1,(now-start)/(seconds*1000));
    draw(t);
    status.textContent='Đang tạo video: '+Math.round(t*100)+'%';
    if(t<1)raf=requestAnimationFrame(frame);
    else recorder.stop();
  }
  raf=requestAnimationFrame(frame);
};
</script>
</body>
</html>
